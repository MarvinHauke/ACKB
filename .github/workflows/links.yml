name: Link health

# Weekly full check. Results are committed to data/link-health.json on the `data` branch (the only
# branch that writes it, so PRs data → main don't conflict); they go live with the next merge.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run links
      - name: Commit link-health.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/link-health.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update link health"
            git push origin data
          fi
