name: Link health

# Weekly full check. Results are committed to data/link-health.json, then the deploy workflow is
# started so broken links show their archived copy. (Pushes made with GITHUB_TOKEN don't trigger
# workflows by themselves; workflow_dispatch is the allowed exception.)
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run links
      - name: Commit link-health.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/link-health.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update link health"
            git push
            gh workflow run deploy.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
